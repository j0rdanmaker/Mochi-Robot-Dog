; RobotDog PlatformIO overlay.
;
; This file is passed to PlatformIO with `-c/--project-conf` (see
; firmware/build.sh), pointed at the upstream project directory
; (firmware/leika, via `-d`). Per PlatformIO's docs, when `-c` is given it
; is used *instead of* the project's own platformio.ini, and any relative
; paths inside it (extra_configs, board_build.sdkconfig_defaults, etc.)
; still resolve relative to the project dir (-d), i.e. firmware/leika/.
;
; We never edit firmware/leika in place (REQUIREMENTS.md F-1). Everything
; RobotDog-specific lives here (REQUIREMENTS.md F-2).
;
; Upstream's own [env] base section builds its feature flags from
; esp32/features.ini via ${features.build_flags}, with every USE_* macro
; defined there (mostly as 0). We deliberately do NOT pull in
; esp32/features.ini or reference ${features.build_flags}: instead
; [env:robotdog] below lists every feature flag itself, at the value
; RobotDog needs. That keeps each -D USE_* macro defined exactly once in
; the final build (no redefinition warnings) without editing features.ini.
; esp32/factory_settings.ini and esp32/build_settings.ini are unaffected
; by our hardware choices, so we keep loading those from upstream as-is.

[platformio]
description = RobotDog (SpotMicroESP32-Leika overlay)
data_dir = esp32/data
src_dir = esp32/src
include_dir = esp32/include
lib_dir = esp32/lib
test_dir = esp32/test
boards_dir = boards
; Paths below resolve relative to the project dir (firmware/leika).
extra_configs =
	esp32/factory_settings.ini
	esp32/build_settings.ini
build_cache_dir = .pio/build_cache
default_envs = robotdog

; ================================================================
; Base environment settings, copied from firmware/leika/platformio.ini's
; [env] section (platform/framework/build tooling), minus the
; ${features.build_flags} include -- see note above.

[env]
platform = espressif32 @ 6.8.1
framework = espidf
monitor_speed = 115200
monitor_filters =
	direct
	esp32_exception_decoder
build_flags =
	${factory_settings.build_flags}
	${build_settings.build_flags}
	-D CORE_DEBUG_LEVEL=4
	-D register=
	-std=gnu++2a
	-Ofast
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
	-I submodules/nanopb
	-Wno-missing-braces
	-Wno-format
	-D CONFIG_HTTPD_WS_SUPPORT=1
build_unflags = -std=gnu++11
build_src_flags =
	-Wformat=2
	-Wformat-truncation
	-Wstack-usage=4096
	-Wno-format
test_ignore = test_embedded
board_build.filesystem = littlefs
board_build.embed_txtfiles =
board_build.sdkconfig_defaults = esp32/sdkconfig.defaults
lib_deps =
lib_ldf_mode = deep
lib_compat_mode = strict
extra_scripts =
	pre:esp32/scripts/pre_build.py
	pre:esp32/scripts/build_app.py

; ================================================================
; RobotDog board + feature environment.
; Board settings copied from upstream's [env:esp32-wroom-camera]
; (Freenove ESP32-S3-WROOM CAM N8R8, DESIGN.md Section 1 U1/Section 3).

[env:robotdog]
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_upload.flash_size = 8MB
upload_speed = 921600
board_build.partitions = esp32/partition_table/default_8MB.csv
build_flags =
	${env.build_flags}

	; --- Board/pins, from upstream [env:esp32-wroom-camera] ---
	-DBOARD_HAS_PSRAM
	-D USE_CAMERA=1
	-D CAMERA_MODEL_ESP32S3_EYE=1
	-D WS2812_PIN=48
	-D USS_LEFT_PIN=1
	-D USS_RIGHT_PIN=14
	-D SDA_PIN=47
	-D SCL_PIN=21

	; --- Kinematics (DESIGN.md Section 6) ---
	-D SPOTMICRO_ESP32

	; --- Feature flags (DESIGN.md Section 1/6, REQUIREMENTS.md Section 3/4) ---
	; U4 GY-87: MPU6050 + HMC5883L + BMP180
	-D USE_MPU6050=1
	-D USE_HMC5883=1
	-D USE_BMP180=1
	; U6 PAJ7620U2 gesture sensor
	-D USE_PAJ7620U2=1
	; U7/U8 HC-SR04P ultrasonic left/right: wired, but OFF in firmware for now.
	; Upstream's USS code includes NewPing, an Arduino-only library, while
	; upstream builds with framework = espidf, so USE_USS=1 cannot compile.
	; Re-enable once firmware/overlay provides an ESP-IDF one-pin
	; ultrasonic driver with NewPing's ping_cm() API (see STATUS backlog).
	-D USE_USS=0
	; U3 PCA9685 servo driver
	-D USE_PCA9685=1
	; Onboard WS2812 status LED
	-D USE_WS2812=1
	; No BNO055 fitted (GY-87 covers the IMU/compass/barometer instead)
	-D USE_BNO055=0
	; Gait/motion engine and mDNS, on by upstream default
	-D USE_MOTION=1
	-D USE_MDNS=1
